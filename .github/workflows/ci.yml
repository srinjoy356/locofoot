name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install JS dependencies
      run: pnpm install

    - name: Typecheck Shared Types
      run: cd packages/shared-types && pnpm build

    - name: Lint Next.js App
      run: cd apps/web && pnpm lint

    - name: Typecheck Next.js App
      run: cd apps/web && pnpm tsc --noEmit

    - name: Build Next.js App (Production)
      run: cd apps/web && pnpm build
      
    - name: Setup Python (uv)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install uv
      run: pip install uv
        
    - name: FastAPI checks
      run: |
        cd apps/api
        uv sync
        # Add mypy or ruff here if configured
