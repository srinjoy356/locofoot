name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 9

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: pnpm

    - name: Install JS dependencies
      run: pnpm install --frozen-lockfile

    - name: Typecheck shared types
      run: cd packages/shared-types && pnpm build

    - name: Typecheck web app
      run: cd apps/web && pnpm tsc --noEmit

    - name: Unit tests
      run: cd apps/web && pnpm vitest run

    # The codebase still has many `no-explicit-any` errors; report them without blocking until they are burnt down.
    - name: Lint web app
      continue-on-error: true
      run: cd apps/web && pnpm lint

    - name: Build web app (production)
      run: cd apps/web && pnpm build
      env:
        NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5

    - name: Install API dependencies
      run: cd apps/api && uv sync --python 3.14

    # Pure logic (formats, standings, brackets): no database needed.
    - name: Format engine unit tests
      run: cd apps/api && uv run pytest tests/test_tournament_format.py --noconftest -q

  integration:
    # Rebuilds the schema from supabase/migrations on a clean Postgres, then runs every API test against it.
    # This is what catches migration drift (columns that only ever existed on a hand-edited database).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: supabase/setup-cli@v1
      with:
        version: latest

    - uses: astral-sh/setup-uv@v5

    - name: Start local Supabase (applies all migrations)
      run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit

    - name: Install API dependencies
      run: cd apps/api && uv sync --python 3.14

    - name: API tests
      run: |
        eval "$(supabase status -o env | sed 's/^/L_/')"
        export SUPABASE_URL="${L_API_URL//\"/}" SUPABASE_SERVICE_ROLE_KEY="${L_SERVICE_ROLE_KEY//\"/}" SUPABASE_JWT_SECRET="${L_JWT_SECRET//\"/}"
        export NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="${L_ANON_KEY//\"/}"
        export CLOUDINARY_CLOUD_NAME=ci CLOUDINARY_API_KEY=ci CLOUDINARY_API_SECRET=ci
        cd apps/api && uv run pytest tests -q

    - uses: pnpm/action-setup@v4
      with:
        version: 9

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Realtime delivery and privacy checks
      run: |
        eval "$(supabase status -o env | sed 's/^/L_/')"
        export SUPABASE_URL="${L_API_URL//\"/}" SUPABASE_SERVICE_ROLE_KEY="${L_SERVICE_ROLE_KEY//\"/}" NEXT_PUBLIC_SUPABASE_ANON_KEY="${L_ANON_KEY//\"/}"
        cd apps/web && pnpm install --frozen-lockfile && cd ../..
        node scripts/realtime-check.cjs
